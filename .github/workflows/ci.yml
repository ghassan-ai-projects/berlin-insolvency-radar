# GitHub Actions CI for Berlin Insolvency Radar
#
# Runs on push/PR to main.
# Pipeline: pre-commit → format → lint → typecheck → unit tests → acceptance tests → e2e tests
#
# Steps invoke the Makefile targets rather than re-spelling the commands, so that
# `make check` locally and CI cannot drift apart.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch makes an in-flight run obsolete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    name: "Lint & Typecheck"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9
        with:
          python-version: "${{ env.PYTHON_VERSION }}"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: Cache pre-commit environments
        uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Pre-commit hooks
        run: make pre-commit

      - name: Format check
        run: make format-check

      - name: Lint
        run: make lint

      - name: Typecheck
        run: make typecheck

  test:
    name: "Tests"
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9
        with:
          python-version: "${{ env.PYTHON_VERSION }}"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: Unit tests
        run: make test

      - name: Acceptance tests
        run: make test-acceptance

      - name: E2E tests (excluding live)
        run: make test-e2e
